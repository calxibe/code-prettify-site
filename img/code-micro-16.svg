<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" role="img" aria-labelledby="title desc">
  <title id="title">CodePrettify compact toolbar mark</title>
  <desc id="desc">Pixel-aligned source lines transform into a clean aligned block.</desc>

  <rect width="16" height="16" rx="4" fill="#08283A"/>

  <g fill="#82B8E3">
    <rect x="2" y="3" width="3.5" height="2" rx="1"/>
    <rect x="2.75" y="7" width="2.75" height="2" rx="1"/>
    <rect x="1.75" y="11" width="3.75" height="2" rx="1"/>
  </g>

  <path d="M7 4 10 8 7 12" fill="none" stroke="#43D7F7" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"/>

  <g fill="#F3FCFF">
    <rect x="11.75" y="3" width="2.5" height="2" rx="1"/>
    <rect x="11.75" y="7" width="2.5" height="2" rx="1"/>
    <rect x="11.75" y="11" width="2.5" height="2" rx="1"/>
  </g>
</svg>
