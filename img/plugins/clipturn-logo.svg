<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">ClipTurn</title>
  <desc id="desc">A video frame surrounded by two rotation arrows</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#18223f"/>
      <stop offset="1" stop-color="#3553a4"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#70e1f5"/>
      <stop offset="1" stop-color="#7b8cff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#080d1f" flood-opacity="0.42"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="224" fill="url(#background)"/>
  <circle cx="512" cy="512" r="390" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>

  <g filter="url(#shadow)">
    <rect x="250" y="326" width="524" height="372" rx="58" fill="#101831" stroke="url(#frame)" stroke-width="28"/>
    <path d="M470 424 L470 600 L626 512 Z" fill="#ffffff"/>
  </g>

  <path d="M260 308 C352 190 526 144 680 202 C731 221 776 250 812 287"
        fill="none" stroke="#ffffff" stroke-width="58" stroke-linecap="round"/>
  <path d="M790 208 L830 310 L722 326" fill="none" stroke="#ffffff" stroke-width="58" stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M764 716 C672 834 498 880 344 822 C293 803 248 774 212 737"
        fill="none" stroke="#70e1f5" stroke-width="58" stroke-linecap="round"/>
  <path d="M234 816 L194 714 L302 698" fill="none" stroke="#70e1f5" stroke-width="58" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
