<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">CodePrettify logo concept</title>
  <desc id="desc">Staggered source lines transform into a clean aligned block.</desc>
  <defs>
    <linearGradient id="background" x1="144" y1="112" x2="880" y2="912" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D3951"/>
      <stop offset="0.52" stop-color="#092739"/>
      <stop offset="1" stop-color="#061722"/>
    </linearGradient>
    <linearGradient id="transform" x1="454" y1="366" x2="572" y2="658" gradientUnits="userSpaceOnUse">
      <stop stop-color="#63E6FF"/>
      <stop offset="1" stop-color="#22B8E6"/>
    </linearGradient>
  </defs>

  <rect x="64" y="64" width="896" height="896" rx="224" fill="url(#background)"/>
  <rect x="68" y="68" width="888" height="888" rx="220" fill="none" stroke="#A5F3FC" stroke-opacity=".13" stroke-width="8"/>

  <g fill="#75A7D3">
    <rect x="190" y="312" width="210" height="68" rx="34"/>
    <rect x="232" y="478" width="168" height="68" rx="34"/>
    <rect x="174" y="644" width="226" height="68" rx="34"/>
  </g>

  <path d="M454 370 572 512 454 654" fill="none" stroke="url(#transform)" stroke-width="68" stroke-linecap="round" stroke-linejoin="round"/>

  <g fill="#F1FCFF">
    <rect x="626" y="312" width="220" height="68" rx="34"/>
    <rect x="626" y="478" width="220" height="68" rx="34"/>
    <rect x="626" y="644" width="220" height="68" rx="34"/>
  </g>
</svg>
