<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
  <title id="title">CodePrettify brand concept presentation</title>
  <desc id="desc">A presentation sheet for a new CodePrettify logo based on transforming unstructured code into a clean aligned result.</desc>
  <defs>
    <linearGradient id="page-background" x1="0" y1="0" x2="1600" y2="1100" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F5F9FB"/>
      <stop offset="1" stop-color="#E7EFF3"/>
    </linearGradient>
    <linearGradient id="hero-background" x1="48" y1="48" x2="1552" y2="554" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0C3147"/>
      <stop offset=".55" stop-color="#081F2E"/>
      <stop offset="1" stop-color="#05131C"/>
    </linearGradient>
    <linearGradient id="mark-background" x1="64" y1="64" x2="960" y2="960" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D3951"/>
      <stop offset=".52" stop-color="#092739"/>
      <stop offset="1" stop-color="#061722"/>
    </linearGradient>
    <linearGradient id="mark-transform" x1="454" y1="370" x2="572" y2="654" gradientUnits="userSpaceOnUse">
      <stop stop-color="#63E6FF"/>
      <stop offset="1" stop-color="#22B8E6"/>
    </linearGradient>
    <filter id="card-shadow" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#173344" flood-opacity=".10"/>
    </filter>
    <filter id="mark-shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="26" stdDeviation="30" flood-color="#020B11" flood-opacity=".34"/>
    </filter>

    <g id="mark">
      <rect x="64" y="64" width="896" height="896" rx="224" fill="url(#mark-background)"/>
      <rect x="68" y="68" width="888" height="888" rx="220" fill="none" stroke="#A5F3FC" stroke-opacity=".13" stroke-width="8"/>
      <g fill="#75A7D3">
        <rect x="190" y="312" width="210" height="68" rx="34"/>
        <rect x="232" y="478" width="168" height="68" rx="34"/>
        <rect x="174" y="644" width="226" height="68" rx="34"/>
      </g>
      <path d="M454 370 572 512 454 654" fill="none" stroke="url(#mark-transform)" stroke-width="68" stroke-linecap="round" stroke-linejoin="round"/>
      <g fill="#F1FCFF">
        <rect x="626" y="312" width="220" height="68" rx="34"/>
        <rect x="626" y="478" width="220" height="68" rx="34"/>
        <rect x="626" y="644" width="220" height="68" rx="34"/>
      </g>
    </g>

    <g id="mono-mark" fill="#071724">
      <rect x="190" y="312" width="210" height="68" rx="34"/>
      <rect x="232" y="478" width="168" height="68" rx="34"/>
      <rect x="174" y="644" width="226" height="68" rx="34"/>
      <rect x="626" y="312" width="220" height="68" rx="34"/>
      <rect x="626" y="478" width="220" height="68" rx="34"/>
      <rect x="626" y="644" width="220" height="68" rx="34"/>
      <path d="M454 370 572 512 454 654" fill="none" stroke="#071724" stroke-width="68" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </defs>

  <rect width="1600" height="1100" fill="url(#page-background)"/>

  <g filter="url(#card-shadow)">
    <rect x="48" y="48" width="1504" height="506" rx="38" fill="url(#hero-background)"/>
  </g>
  <circle cx="1400" cy="115" r="230" fill="#22C7E8" fill-opacity=".04"/>
  <circle cx="1500" cy="515" r="320" fill="#5ADAF4" fill-opacity=".035"/>

  <g transform="translate(118 116) scale(.36)" filter="url(#mark-shadow)">
    <use href="#mark"/>
  </g>

  <text x="560" y="299" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="132" font-weight="750" letter-spacing="-5">
    <tspan fill="#F4FBFF">Code</tspan><tspan fill="#55DDF5">Prettify</tspan>
  </text>
  <text x="568" y="370" fill="#99B6C6" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="29" font-weight="650" letter-spacing="8">FORMAT  ·  REPAIR  ·  TRANSFORM</text>
  <text x="568" y="448" fill="#D4E7F0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="25" font-weight="400">From untidy input to trustworthy structure.</text>

  <g filter="url(#card-shadow)">
    <rect x="48" y="594" width="932" height="458" rx="34" fill="#FFFFFF"/>
    <rect x="1012" y="594" width="540" height="458" rx="34" fill="#FFFFFF"/>
  </g>

  <text x="96" y="662" fill="#73909F" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="3">RESPONSIVE MARK</text>
  <text x="1060" y="662" fill="#73909F" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="3">ONE-COLOR USE</text>

  <g transform="translate(100 700) scale(.22)">
    <use href="#mark"/>
  </g>
  <text x="104" y="976" fill="#8197A3" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18">128 px</text>

  <g transform="translate(384 762) scale(.12)">
    <use href="#mark"/>
  </g>
  <text x="399" y="932" fill="#8197A3" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18">64 px</text>

  <g transform="translate(572 793) scale(.07)">
    <use href="#mark"/>
  </g>
  <text x="585" y="905" fill="#8197A3" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18">32 px</text>

  <g transform="translate(718 808) scale(.04)">
    <use href="#mark"/>
  </g>
  <text x="715" y="891" fill="#8197A3" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18">16 px</text>

  <path d="M358 838h-40m228 0h-40m188 0h-40" stroke="#D7E3E8" stroke-width="2" stroke-dasharray="4 7"/>

  <rect x="1060" y="706" width="444" height="144" rx="26" fill="#071724"/>
  <g transform="translate(1086 706) scale(.14)">
    <g fill="#FFFFFF">
      <rect x="190" y="312" width="210" height="68" rx="34"/>
      <rect x="232" y="478" width="168" height="68" rx="34"/>
      <rect x="174" y="644" width="226" height="68" rx="34"/>
      <rect x="626" y="312" width="220" height="68" rx="34"/>
      <rect x="626" y="478" width="220" height="68" rx="34"/>
      <rect x="626" y="644" width="220" height="68" rx="34"/>
    </g>
    <path d="M454 370 572 512 454 654" fill="none" stroke="#FFFFFF" stroke-width="68" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <rect x="1060" y="878" width="444" height="126" rx="26" fill="#F2F6F8"/>
  <g transform="translate(1086 870) scale(.14)">
    <use href="#mono-mark"/>
  </g>

  <text x="1264" y="791" fill="#EAF8FC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">Reversed</text>
  <text x="1264" y="955" fill="#071724" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">Monochrome</text>
</svg>
