<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 520" role="img" aria-labelledby="title desc">
  <title id="title">CodePrettify horizontal logo concept</title>
  <desc id="desc">CodePrettify wordmark beside the raw-to-clean transformation mark.</desc>
  <defs>
    <linearGradient id="lockup-background" x1="80" y1="64" x2="424" y2="456" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D3951"/>
      <stop offset=".52" stop-color="#092739"/>
      <stop offset="1" stop-color="#061722"/>
    </linearGradient>
    <linearGradient id="lockup-transform" x1="229" y1="198" x2="286" y2="316" gradientUnits="userSpaceOnUse">
      <stop stop-color="#63E6FF"/>
      <stop offset="1" stop-color="#22B8E6"/>
    </linearGradient>
  </defs>

  <g>
    <rect x="64" y="48" width="424" height="424" rx="106" fill="url(#lockup-background)"/>
    <rect x="68" y="52" width="416" height="416" rx="102" fill="none" stroke="#A5F3FC" stroke-opacity=".13" stroke-width="6"/>

    <g fill="#75A7D3">
      <rect x="124" y="176" width="100" height="32" rx="16"/>
      <rect x="144" y="255" width="80" height="32" rx="16"/>
      <rect x="116" y="334" width="108" height="32" rx="16"/>
    </g>

    <path d="m250 204 57 56-57 56" fill="none" stroke="url(#lockup-transform)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>

    <g fill="#F1FCFF">
      <rect x="333" y="176" width="104" height="32" rx="16"/>
      <rect x="333" y="255" width="104" height="32" rx="16"/>
      <rect x="333" y="334" width="104" height="32" rx="16"/>
    </g>
  </g>

  <text x="560" y="282" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="144" font-weight="750" letter-spacing="-5">
    <tspan fill="#071724">Code</tspan><tspan fill="#148DB7">Prettify</tspan>
  </text>
  <text x="568" y="355" fill="#526B7A" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="31" font-weight="650" letter-spacing="8">FORMAT  ·  REPAIR  ·  TRANSFORM</text>
</svg>
